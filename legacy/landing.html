<html lang="de">

<meta charset="utf-8">

<title>Gründungs-Check – Trägt deine Geschäftsidee?</title>
<meta name="description" content="Ehrlicher Bericht zu deiner Geschäftsidee in Deutschland: Meister, Erlaubnis, Aufenthalt, Rechtsform, Break-even und die ersten 30 Tage. Kostenlos in der Testphase.">
<meta name="color-scheme" content="light">
<style>
:root{
  --brand:#0f2d4a;--brand-2:#1b4673;--link:#1d5fa8;--ink:#16202c;--muted:#56616f;--faint:#8a94a1;
  --line:#dfe4ea;--soft:#f3f6f9;--tint:#e6eef7;--paper:#fff;--zebra:#f6f8fb;
  --green:#1f7a45;--green-soft:#e2f2e8;--amber:#a86200;--amber-soft:#fdf0d8;--red:#b42318;--red-soft:#fde7e5;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--link)}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
h1,h2,h3{margin:0;letter-spacing:-.015em;color:var(--brand)}
h2{font-size:clamp(28px,3.2vw,38px);line-height:1.18;font-weight:700}
h3{font-size:19px;line-height:1.3;font-weight:650}
.lead{font-size:19px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;border-radius:8px;padding:14px 24px;transition:background .15s;border:2px solid var(--brand)}
.btn:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.line{background:transparent;color:var(--brand)}
.btn.line:hover{background:var(--tint)}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #8db7e8;outline-offset:2px}
section{padding:88px 0}
section.soft{background:var(--soft)}
.head{max-width:680px;margin-bottom:44px}
.head p{color:var(--muted);margin:14px 0 0;font-size:18px}
.ico{width:22px;height:22px;flex:0 0 auto;color:var(--brand)}

/* Kopf */
header.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--brand);font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo svg{width:30px;height:30px}
nav.menu{display:flex;align-items:center;gap:28px;font-size:15.5px}
nav.menu a{color:var(--ink);text-decoration:none}
nav.menu a.nl:hover{color:var(--link)}
nav.menu a.lang{color:var(--muted);font-size:14.5px}
nav.menu .btn{color:#fff;padding:10px 18px;font-size:15px;white-space:nowrap}
.logo span{white-space:nowrap}
.inst{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:14.5px;font-weight:600;color:var(--brand);background:var(--tint);border:0;border-radius:8px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.inst[hidden]{display:none}.inst svg{width:18px;height:18px}
@media (max-width:640px){.inst span{display:none}.inst{padding:8px}}
@media (max-width:900px){nav.menu a.nl{display:none}}
@media (max-width:480px){.logo span{font-size:15px}.logo svg{width:26px;height:26px}nav.menu{gap:12px}nav.menu a.lang{font-size:13.5px}nav.menu .btn{padding:8px 11px;font-size:13.5px}header.top .wrap{padding:0 14px;gap:10px}}

/* Hero */
.hero{padding:64px 0 80px}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(34px,4.2vw,50px);line-height:1.08;font-weight:700;letter-spacing:-.025em;margin:0 0 20px}
.hero .lead{margin:0 0 30px;max-width:33em}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.checks{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 26px;font-size:15.5px;color:var(--ink)}
.checks li{display:flex;align-items:center;gap:8px}
.checks svg{width:18px;height:18px;color:var(--green)}
.card-float{max-width:480px;margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px rgba(15,45,74,.16);padding:20px 22px}
.card-float .ct{font-size:13.5px;color:var(--muted);margin:0 0 10px}
@media (max-width:920px){.hero .wrap{grid-template-columns:1fr;gap:36px}.hero{padding-top:36px}.card-float{margin:0 auto}}

/* Vertrauensleiste */
.trust{padding:40px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
.trust .t{display:flex;gap:14px;align-items:flex-start}
.trust b{display:block;color:var(--brand);font-size:16px;margin-bottom:2px}
.trust p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.5}
@media (max-width:900px){.trust .wrap{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.trust .wrap{grid-template-columns:1fr}}

/* Probleme */
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:start}
.qs{display:grid;gap:0}
.qs div{padding:22px 0;border-top:1px solid var(--line)}
.qs div:last-child{border-bottom:1px solid var(--line)}
.qs h3{margin:0 0 6px}
.qs p{margin:0;color:var(--muted);font-size:16px}
@media (max-width:880px){.split{grid-template-columns:1fr;gap:28px}}

/* Leistungen */
.gets{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 40px}
.gets .g{display:flex;gap:16px}
.gets .g .ib{width:44px;height:44px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.gets h3{margin:2px 0 6px}
.gets p{margin:0;color:var(--muted);font-size:16px}
@media (max-width:920px){.gets{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.gets{grid-template-columns:1fr}}

/* Ablauf */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{position:relative;padding-top:64px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;top:0;left:0;width:46px;height:46px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.steps li::after{content:"";position:absolute;top:23px;left:62px;right:-16px;height:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps .t{font-size:14.5px;color:var(--link);font-weight:600;margin-bottom:4px}
.steps p{margin:6px 0 0;color:var(--muted);font-size:16px}
@media (max-width:820px){.steps{grid-template-columns:1fr}.steps li::after{display:none}}

/* Beispiel */
.sample{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start}
.sheet{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 0 var(--line),0 24px 50px rgba(15,45,74,.10);overflow:hidden}
.sheet .cov{background:var(--brand);color:#fff;padding:18px 22px}
.sheet .cov small{display:block;font-size:13px;opacity:.8}
.sheet .cov b{display:block;font-size:19px;margin-top:4px;font-weight:650}
.sheet .doc{padding:18px 22px 6px}
.ticks{list-style:none;margin:22px 0 28px;padding:0;display:grid;gap:12px}
.ticks li{display:flex;gap:10px;align-items:flex-start;font-size:16.5px}
.ticks svg{width:20px;height:20px;color:var(--green);margin-top:3px;flex:0 0 auto}
@media (max-width:900px){.sample{grid-template-columns:1fr}}

/* Bericht-Bausteine */
.doc{font-size:14px}
.verdict{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.verdict svg{display:block;width:104px;height:104px}
.verdict .label{display:none}
.verdict .tier{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.verdict .text{font-size:14.5px;line-height:1.45;margin:0;color:var(--ink)}
.t-green .tier{background:var(--green-soft);color:var(--green)} .t-amber .tier{background:var(--amber-soft);color:var(--amber)} .t-red .tier{background:var(--red-soft);color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--zebra)}
.kpi .v{font-weight:700;font-size:17px;color:var(--brand);line-height:1.2}
.kpi .l{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.bars{border:1px solid var(--line);border-radius:10px;padding:10px 12px 6px;margin:0 0 12px}
.bars .title{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.bar{display:grid;grid-template-columns:44% 1fr 58px;gap:8px;align-items:center;margin:0 0 7px;font-size:12.5px}
.bar .track{position:relative;height:10px;background:var(--tint);border-radius:999px}
.bar .seg{position:absolute;top:0;bottom:0;border-radius:999px;background:#9fb3cc;min-width:6px}
.bar.hi .seg{background:var(--brand)} .bar.hi .lab{font-weight:700}
.bar .val{text-align:right;font-weight:600;white-space:nowrap}
.bars .axis{display:grid;grid-template-columns:44% 1fr 58px;gap:8px;font-size:10px;color:var(--faint)}
.bars .axis .ticks{display:flex;justify-content:space-between;margin:0}
.doc table{border-collapse:collapse;width:100%;font-size:12.5px;margin:0 0 12px}
.doc th{background:var(--brand);color:#fff;font-weight:600;text-align:left;padding:7px 9px}
.doc td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-right:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--brand)}
td.score{white-space:nowrap;font-weight:700}
.warn{display:inline-block;background:var(--amber-soft);color:#7a4500;border-radius:4px;font-size:11px;font-weight:600;padding:0 6px;line-height:18px;white-space:nowrap}
.assume{color:var(--faint);font-size:.88em;font-style:italic}
.doc h2,.doc h3{display:none}

/* Über uns */
.about{display:grid;grid-template-columns:320px 1fr;gap:64px;align-items:start}
.portrait{border-radius:14px;overflow:hidden;position:relative;aspect-ratio:4/5;background:linear-gradient(160deg,#e6eef7,#c9d8ea);display:flex;align-items:center;justify-content:center}
.portrait .ini{font-size:72px;font-weight:700;color:rgba(15,45,74,.35);letter-spacing:-.02em}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.portrait.loaded img{opacity:1}.portrait.loaded .ini{display:none}
.about .name{margin-top:14px;font-weight:650;color:var(--brand)}
.about .role{color:var(--muted);font-size:15px}
.about .txt p{color:var(--ink);margin:0 0 16px}
.quote{font-size:22px;line-height:1.4;color:var(--brand);font-weight:600;border-left:4px solid var(--brand);padding:2px 0 2px 20px;margin:0 0 26px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;margin:26px 0 0;padding:20px 22px;background:var(--soft);border-radius:10px;font-size:15px}
.facts dt{color:var(--muted)}.facts dd{margin:0;color:var(--ink);font-weight:600}
.limits{margin-top:20px;border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:0 8px 8px 0;padding:14px 18px;font-size:15.5px;color:#5a3700}
@media (max-width:880px){.about{grid-template-columns:1fr}.portrait{max-width:280px}}

/* FAQ */
.faqgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px;align-items:start}
.faq details{border-bottom:1px solid var(--line)}
.faq details:first-child{border-top:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:600;font-size:17.5px;color:var(--brand);display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{width:20px;height:20px;transition:transform .2s;flex:0 0 auto}
.faq details[open] summary svg{transform:rotate(45deg)}
.faq details p{margin:0 0 20px;color:var(--muted)}
@media (max-width:880px){.faqgrid{grid-template-columns:1fr;gap:20px}}

/* Schluss */
.final{background:var(--brand);color:#fff;padding:72px 0}
.final .wrap{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap}
.final h2{color:#fff;margin:0 0 10px}
.final p{margin:0;color:#c9d6e6;max-width:38em}
.final .btn{background:#fff;color:var(--brand);border-color:#fff}
.final .btn:hover{background:var(--tint)}
footer{background:#0b2238;color:#b8c6d6;padding:56px 0 40px;font-size:14.5px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
footer b{display:block;color:#fff;margin-bottom:10px;font-size:15px}
footer a{color:#dbe5f0;text-decoration:none}
footer a:hover{text-decoration:underline}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer details summary{cursor:pointer;color:#dbe5f0}
footer details p{margin:10px 0 0;color:#b8c6d6}
footer .base{margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#8fa2b8}
footer .logo{color:#fff;margin-bottom:12px}
@media (max-width:760px){footer .cols{grid-template-columns:1fr}}
@media (max-width:560px){.verdict{grid-template-columns:72px 1fr;gap:12px}.verdict svg{width:72px;height:72px}.kpis{grid-template-columns:1fr 1fr}.kpis .kpi:nth-child(3){grid-column:1/-1}.bar,.bars .axis{grid-template-columns:38% 1fr 52px}}
.kpi .v{white-space:nowrap}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
