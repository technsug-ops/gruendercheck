<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bericht</title>
<style>
:root{
  --ink:#16202c;--muted:#56616f;--faint:#8a94a1;--line:#dfe4ea;--zebra:#f6f8fb;
  --accent:#0f2d4a;--soft:#e6eef7;--paper:#fff;--bg:#eef2f6;
  --green:#1f7a45;--green-soft:#e2f2e8;--amber:#a86200;--amber-soft:#fdf0d8;--red:#b42318;--red-soft:#fde7e5;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:var(--sans);
}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}

.page{max-width:900px;margin:16px auto 40px;background:var(--paper);border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.06);padding:0 0 36px;overflow:hidden}
.cover{background:var(--accent);color:#fff;padding:26px 48px 24px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;right:0;top:0;bottom:0;width:38%;background:linear-gradient(135deg,transparent 0 40%,rgba(255,255,255,.06) 40% 60%,transparent 60%),linear-gradient(135deg,transparent 0 62%,rgba(255,255,255,.05) 62% 78%,transparent 78%)}
.cover .brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;opacity:.85;position:relative;z-index:1}
.cover h1{font:700 30px/1.18 var(--sans);letter-spacing:-.02em;margin:18px 0 6px;max-width:30ch;position:relative;z-index:1}
.cover .subtitle{font-size:13.5px;opacity:.85;margin:0;position:relative;z-index:1}
.doc{padding:8px 48px 0}

.doc h2{font:700 20px/1.25 var(--sans);color:var(--accent);margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);break-inside:avoid}
.doc h2 .n{font:700 12px/24px var(--sans);color:#fff;background:var(--accent);border-radius:999px;width:24px;height:24px;display:inline-block;text-align:center;vertical-align:3px;margin-right:10px}
.doc h3{font-size:15.5px;color:var(--accent);margin:20px 0 8px}
.doc p{margin:0 0 10px}
.doc ul{margin:0 0 12px;padding-left:20px}
.doc li{margin:3px 0}
.doc ul li::marker{color:var(--accent)}
.doc ol{list-style:none;counter-reset:o;padding:0;margin:0 0 14px}
.doc ol>li{counter-increment:o;position:relative;padding:10px 12px 10px 46px;margin:0 0 8px;background:var(--zebra);border-radius:8px;border-left:3px solid var(--accent)}
.doc ol>li::before{content:counter(o);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font:700 12px/24px var(--sans);text-align:center}
.doc strong{color:#0f1a14}

.doc table{border-collapse:separate;border-spacing:0;width:100%;margin:6px 0 16px;font-size:13.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.doc th{background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;text-align:left;padding:8px 10px}
.doc td{padding:8px 10px;vertical-align:top;border-top:1px solid var(--line)}
.doc tbody tr:nth-child(even) td{background:var(--zebra)}
.doc td.num,.doc th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc tr.total td{background:var(--soft)!important;font-weight:700}
.doc blockquote{margin:0 0 14px;padding:12px 16px;background:var(--soft);border-left:4px solid var(--accent);border-radius:6px}
.doc blockquote p:last-child{margin:0}
.doc hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.doc code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:#eef2f6;padding:1px 4px;border-radius:4px}
.warn{display:inline-block;background:var(--amber-soft);color:#7a4f0e;border:1px solid #efd9a8;border-radius:999px;font-size:11px;font-weight:600;padding:0 7px;line-height:18px;white-space:nowrap}
.assume{color:var(--faint);font-size:.88em;font-style:italic;white-space:nowrap}

.verdict{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin:4px 0 18px;background:linear-gradient(180deg,#fff,var(--zebra))}
.verdict svg{display:block;width:150px;height:150px}
.verdict .tier{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:3px 11px;margin-bottom:8px}
.verdict .text{font:500 16.5px/1.5 var(--sans);margin:0}
.verdict .label{display:none}
.t-green .tier{background:var(--green-soft);color:var(--green)} .t-amber .tier{background:var(--amber-soft);color:var(--amber)} .t-red .tier{background:var(--red-soft);color:var(--red)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 18px}
.kpi{border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:8px;padding:10px 12px;background:#fff}
.kpi .v{font:700 22px/1.15 var(--sans);color:var(--accent);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}

.bars{border:1px solid var(--line);border-radius:10px;padding:14px 16px 10px;margin:6px 0 18px}
.bars .title{font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:10px}
.bar{display:grid;grid-template-columns:minmax(150px,38%) 1fr 74px;gap:12px;align-items:center;margin:0 0 9px;font-size:13px}
.bar .track{position:relative;height:14px;background:var(--zebra);border-radius:999px}
.bar .seg{position:absolute;top:0;bottom:0;border-radius:999px;background:#9fb3cc;min-width:8px}
.bar.hi .seg{background:var(--accent)}
.bar.hi .lab{font-weight:700}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.bars .axis{display:grid;grid-template-columns:minmax(150px,38%) 1fr 74px;gap:12px;font-size:10.5px;color:var(--faint)}
.bars .axis .ticks{display:flex;justify-content:space-between}

.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--accent)}
td.score{white-space:nowrap;font-weight:700}

.foot{margin:28px 48px 0;border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px}
@media (max-width:640px){.cover,.doc{padding-left:18px;padding-right:18px}.foot{margin-left:18px;margin-right:18px}.verdict{grid-template-columns:1fr}.bar,.bars .axis{grid-template-columns:110px 1fr 60px}}
@media print{
  @page{size:A4;margin:12mm 13mm 14mm}
  body{background:#fff;font-size:12px;line-height:1.5}
  .tools{display:none}
  .page{box-shadow:none;margin:0;max-width:none;border-radius:0;padding:0;overflow:visible}
  .cover{border-radius:8px;padding:20px 26px 18px}
  .cover h1{font-size:25px}
  .doc{padding:4px 2px 0}
  .doc h2{font-size:16.5px;margin:20px 0 9px}
  .doc table{font-size:11px}
  .doc th{font-size:10.5px;padding:6px 8px}
  .doc td{padding:5px 8px}
  .doc ol>li{padding:7px 10px 7px 40px}
  .doc ol>li::before{top:7px;left:9px}
  .verdict{grid-template-columns:120px 1fr;padding:12px 16px}
  .verdict svg{width:120px;height:120px}
  .verdict .text{font-size:14.5px}
  .kpi .v{font-size:18px}
  .foot{margin:22px 2px 0}
  .doc h2,.doc h3{break-after:avoid}
  .doc blockquote,.doc tr,.verdict,.kpis,.bars,.doc ol>li{break-inside:avoid}
  .doc thead{display:table-header-group}
}

.actions{max-width:900px;margin:0 auto;padding:20px 16px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.actions .btn{font:inherit;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;padding:10px 18px;cursor:pointer;text-decoration:none}
.actions .hint{color:var(--muted);font-size:13px}
.cta{max-width:900px;margin:0 auto 48px;padding:0 16px}
.cta div{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:16px 20px}
.cta a{color:var(--accent);font-weight:600}
.state{max-width:640px;margin:80px auto;padding:0 16px;text-align:center;color:var(--muted)}
@media print{.actions,.cta{display:none}}
</style>
<meta name="theme-color" content="#0f2d4a">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" id="mf" href="/manifest-de.webmanifest">
<script>if(/^\/tr(\/|$)/.test(location.pathname))document.getElementById('mf').href='/manifest-tr.webmanifest'</script>
</head>
<body>
<div class="actions" id="actions" hidden><span class="hint" id="hint"></span><button class="btn" id="pdf"></button></div>
<div class="state" id="state"></div>
<div class="page" id="page" hidden>
  <div class="cover">
    <div class="brand"><b id="brand"></b><span id="meta"></span></div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="doc" id="doc"></div>
  <div class="foot"><span id="foot"></span><span id="footbrand"></span></div>
</div>
<div class="cta" id="cta" hidden><div id="ctatext"></div></div>
<script type="module">
import { setLang, md, inline, splitCover } from '/render.js';
const $ = (id) => document.getElementById(id);
const UI = {
  de: { pdf: 'Als PDF speichern', hint: 'Tipp: Im Druckdialog „Als PDF speichern“ wählen und „Kopf- und Fußzeilen“ ausschalten.', loading: 'Bericht wird geladen …', missing: 'Dieser Bericht wurde nicht gefunden. Bitte prüfe den Link aus der E-Mail.',
        cta: (u) => `War der Bericht hilfreich? <a href="${u}">Zwei Minuten Rückmeldung geben</a> – das hilft uns sehr.` },
  tr: { pdf: 'PDF olarak kaydet', hint: 'İpucu: Yazdırma penceresinde „PDF olarak kaydet“ seç, „Üstbilgi ve altbilgi“ kutusunu kapat.', loading: 'Rapor yükleniyor …', missing: 'Bu rapor bulunamadı. Lütfen e-postadaki linki kontrol et.',
        cta: (u) => `Rapor işine yaradı mı? <a href="${u}">İki dakikalık geri bildirim ver</a>, bize çok yardımcı olur.` },
};
const path = location.pathname.replace(/\/+$/, '');
let lang = path.startsWith('/tr') ? 'tr' : 'de';
const id = new URLSearchParams(location.search).get('id') || '';
$('state').textContent = UI[lang].loading;
try {
  if (!/^[0-9a-f-]{36}$/.test(id)) throw new Error('bad');
  const r = await fetch('/api/report?id=' + encodeURIComponent(id));
  if (!r.ok) throw new Error('nf');
  const d = await r.json();
  lang = d.lang === 'tr' ? 'tr' : 'de';
  const T = setLang(lang), u = UI[lang];
  document.documentElement.lang = lang;
  const c = splitCover(d.md);
  $('brand').textContent = T.report;
  $('meta').textContent = `${T.date} ${new Date(d.sent_at).toLocaleDateString(lang === 'tr' ? 'tr-TR' : 'de-DE')}`;
  $('title').textContent = c.title || T.report;
  $('subtitle').innerHTML = c.sub ? inline(c.sub) : '';
  $('doc').innerHTML = md(c.body);
  $('foot').textContent = T.foot; $('footbrand').textContent = T.brand;
  document.title = (c.title || T.report).slice(0, 80);
  $('pdf').textContent = u.pdf; $('hint').textContent = u.hint; $('pdf').onclick = () => window.print();
  $('ctatext').innerHTML = u.cta(`/${lang}/feedback?id=${id}`);
  $('state').hidden = true; $('page').hidden = false; $('actions').hidden = false; $('cta').hidden = false;
} catch {
  $('state').textContent = UI[lang].missing;
}
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
